server {
    listen 80;
    server_name api.jeenora.com;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.jeenora.com;
    
    ssl_certificate /etc/letsencrypt/live/api.jeenora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jeenora.com/privkey.pem;
    
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/Jeenora_server;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    access_log  /www/wwwlogs/api.jeenora.com.log;
    error_log  /www/wwwlogs/api.jeenora.com.error.log;
}
